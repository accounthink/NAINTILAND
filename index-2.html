<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
/*LOGIC_START*/
const STATUS = ['Tersedia','Booking','Terjual'];
const PROGRES = ['On Progress','Selesai'];
const KEL_INV = {'Elektronik & Komputer':4,'Furnitur & Perabot':4,'Kendaraan':8,'Mesin & Peralatan Proyek':8,'Alat Kerja (Sekop, Ember, dll)':2,'Bangunan Non-Permanen':10,'Lain-lain':4};
const invTotal = v => Math.round((+v.qty || 0) * (+v.harga || 0));
function susut(v, asOf){
  const per = invTotal(v), residu = Math.min(per, Math.max(0, +v.residu || 0)), base = per - residu, n = Math.max(1, Math.round((+v.umur || 1) * 12));
  const m = /^(\d{4})-(\d{2})/.exec(v.tanggal || ''), a = /^(\d{4})-(\d{2})/.exec(asOf || '');
  let bulan = 0; if (m && a) bulan = (+a[1] - +m[1]) * 12 + (+a[2] - +m[2]) + 1;
  bulan = Math.max(0, Math.min(n, bulan));
  const perBulan = base / n, akum = bulan >= n ? base : Math.round(perBulan * bulan);
  return {perolehan:per,residu,base,n,perBulan,bulan,akum,buku:per - akum,aktif:bulan > 0 && bulan < n,habis:bulan >= n};
}
const KAT_PBB = 'PBB', KAT_AGENT = 'Biaya Agent';
const KAT_BELI = ['Tanah','Material Bangunan','Upah / Tukang','Kontraktor','Perizinan & Legal',KAT_PBB,KAT_AGENT,'Infrastruktur Kawasan','Pemasaran & Komisi','Operasional','Lain-lain'];
const JENIS_PEND = ['Tanda Jadi / Booking','Uang Muka (DP)','Cicilan / Angsuran','Pelunasan / Pencairan KPR','Pendapatan Lain'];
const PEND_LAIN = 'Pendapatan Lain';
const KAT_LAIN = ['Marketing / Pemasaran','Entertain','Gaji & Honor','Operasional Kantor','Transportasi & BBM','Listrik, Air & Internet','Perizinan & Legal','Pajak','Lain-lain'];
const KAT_MATERIAL = 'Material Bangunan', KAT_UPAH = 'Upah / Tukang';
const SATUAN = ['sak','m³','batang','buah','lembar','kg','m²','dus','liter','roll','titik','ls'];
const PEKERJAAN = ['Pondasi','Dinding','Atap','Plumbing','Listrik','Plafon','Keramik','Finishing / Cat','Kusen & Pintu','Pagar & Carport','Lainnya'];

function emptyDb(){
  return {perusahaan:'NAINTILAND',clusters:[{id:'c1',nama:'CLUSTER SOFIA'},{id:'c2',nama:'GRIYA ESPRI'}],units:[],trx:[],lain:[],modal:[],inventaris:[],rekon:[],ttd:defaultTtd()};
}
function defaultTtd(){ return {kota:'Makassar',dibuat:'Annisa Fitriandini M',jabatanDibuat:'Accounting',mengetahui:'Yuspratman Yunus',jabatanMengetahui:'Direktur'}; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function compute(db, onlyCluster){
  const um = {}, cm = {};
  const clusters = db.clusters.filter(c => !onlyCluster || c.id === onlyCluster);
  for (const c of clusters) cm[c.id] = {c,units:[],umumBiaya:0,umumPend:0};
  for (const u of db.units){
    if (!cm[u.clusterId]) continue;
    um[u.id] = {u,biayaL:0,material:0,upah:0,pbb:0,agent:0,diterima:0,alok:0,biaya:0,sisa:0,margin:0,nTrx:0};
    cm[u.clusterId].units.push(um[u.id]);
  }
  for (const t of db.trx){
    const j = +t.jumlah || 0;
    if (!cm[t.clusterId]) continue;
    if (t.unitId && um[t.unitId]){
      um[t.unitId].nTrx++;
      if (t.jenis === 'pembelian'){ um[t.unitId].biayaL += j; if (t.kategori === KAT_MATERIAL) um[t.unitId].material += j; else if (t.kategori === KAT_UPAH) um[t.unitId].upah += j; else if (t.kategori === KAT_PBB) um[t.unitId].pbb += j; else if (t.kategori === KAT_AGENT) um[t.unitId].agent += j; } else um[t.unitId].diterima += j;
    } else if (t.jenis === 'pembelian') cm[t.clusterId].umumBiaya += j;
    else cm[t.clusterId].umumPend += j;
  }
  const out = [];

function pdfItemsToLines(items){
  const its = items.filter(i => String(i.s).trim() !== '').slice().sort((a, b) => b.y - a.y || a.x - b.x), lines = [];
  for (const it of its){ const L = lines[lines.length - 1]; if (L && Math.abs(L.y - it.y) <= 3) L.items.push(it); else lines.push({y:it.y,items:[it]}); }

    L.items.sort((a, b) => a.x - b.x); const cells = [];
    for (const it of L.items){ const t = String(it.s).trim(), c = cells[cells.length - 1];
      if (c && it.x - c.x1 < 6){ c.t += (it.x - c.x1 > 1 ? ' ' : '') + t; c.x1 = it.x + it.w; } else cells.push({t,x0:it.x,x1:it.x + it.w}); }

  });
}
function pdfLinesToRows(lines){
  const isAmt = t => /^[+\-(]?\s*(Rp\.?\s*)?[+\-]?[\d.,]+\s*\)?\s*(DB|CR|DR|KR|D|K)?$/i.test(String(t).trim()) && /\d/.test(t) && parseAmount(t) !== null;

  const joined = l => l.map(c => c.t).join(' ').toLowerCase();
  let hi = lines.findIndex(l => /tanggal|tgl|date|post/.test(joined(l)) && /debit|debet|kredit|credit|mutasi|jumlah|saldo|balance|nominal/.test(joined(l)));
  if (hi < 0){
    const rows = []; for (const l of lines){ if (dateAt(l) >= 0) rows.push(l.map(c => c.t)); else if (rows.length && !l.some(c => isAmt(c.t))){ const r = rows[rows.length - 1]; let bi = 0; r.forEach((x, j) => { if (x.length > r[bi].length) bi = j; }); r[bi] += ' ' + l.map(c => c.t).join(' '); } }
    return rows;
  }
  const hdr = lines[hi].map(c => ({t:c.t,x0:c.x0,x1:c.x1,c:(c.x0 + c.x1) / 2})), hj = joined(lines[hi]), n = hdr.length;
  let ketIdx = hdr.findIndex(h => /keterangan|deskripsi|uraian|remark|berita|transaksi|description|detail/i.test(h.t)); if (ketIdx < 0) ketIdx = Math.min(1, n - 1);
  const rows = [hdr.map(h => h.t)]; let cur = null;
  for (let li = hi + 1; li < lines.length; li++){
    const l = lines[li]; if (joined(l) === hj) continue;
    if (dateAt(l) >= 0){
      cur = new Array(n).fill('');
      for (const c of l){ let best = 0, bd = 1e9;
        hdr.forEach((h, j) => { const d = isAmt(c.t) ? Math.min(Math.abs(c.x1 - h.x1), Math.abs((c.x0 + c.x1) / 2 - h.c)) : Math.abs(c.x0 - h.x0); if (d < bd){ bd = d; best = j; } });
        cur[best] = (cur[best] ? cur[best] + ' ' : '') + c.t; }
      rows.push(cur);
    } else if (cur && !l.some(c => isAmt(c.t))) cur[ketIdx] += ' ' + l.map(c => c.t).join(' ');
    else if (cur && l.some(c => isAmt(c.t))) cur = null;
  }
  return rows;
}

function invRingkas(list){

  return r;
}

async function readPdf(file, pwd){

    const n = DB.units.filter(u => u.clusterId === c.id).length, m = DB.trx.filter(t => t.clusterId === c.id).length + DB.lain.filter(l => l.clusterId === c.id).length + DB.modal.filter(x => x.clusterId === c.id).length + DB.inventaris.filter(x => x.clusterId === c.id).length;
    return '<tr><td><input data-f="cname" data-id="' + c.id + '" value="' + esc(c.nama) + '" aria-label="Nama cluster" style="width:100%"></td><td class="num">' + n + ' unit</td><td class="num">' + m + ' transaksi</td><td class="num">' + (n || m ? '' : '<button class="btn sm dng" data-act="delcluster" data-id="' + c.id + '">Hapus</button>') + '</td></tr>';
  }).join('');
  return header('Cluster & Data','') +
    '<div class="card"><h3>Perusahaan</h3><div class="row"><label class="fld grow">Nama perusahaan<input data-f="pname" value="' + esc(DB.perusahaan) + '"></label></div></div>' +
    '<div class="card"><h3>Cluster</h3><table><tbody>' + rows + '</tbody></table><div class="row" style="margin:12px 0 0"><label class="fld grow">Tambah cluster baru<input id="newcl" placeholder="Nama cluster"></label><button class="btn pri" data-act="addcluster">Tambah</button></div></div>' +
    '<div class="card"><h3>Cadangan data</h3><p class="muted" style="margin-top:0">Data tersimpan di browser perangkat ini. Unduh cadangan secara berkala, terutama sebelum membersihkan data browser atau pindah perangkat.</p><div class="row" style="margin:0"><button class="btn pri" data-act="export">Unduh cadangan (JSON)</button><button class="btn" data-act="csv">Unduh transaksi (CSV)</button><label class="btn" style="cursor:pointer">Pulihkan dari file JSON<input type="file" accept=".json,application/json" data-f="import" style="display:none"></label></div></div>' +
    '<div class="card"><h3>Contoh dan reset</h3><div class="row" style="margin:0"><button class="btn" data-act="sample">Muat data contoh</button><button class="btn dng" data-act="reset">Hapus semua unit, transaksi, biaya lain, modal &amp; inventaris</button></div></div>';
}

/* ---------- Helpers & actions ---------- */
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
let yesFn = null;
function confirmBox(msg, yes, label){
  yesFn = yes;
  $('#overlay').innerHTML = '<div class="modalbg"><div class="modal" role="dialog" aria-modal="true"><p style="margin-top:0">' + esc(msg) + '</p><div class="row" style="margin:0;justify-content:flex-end"><button class="btn" data-act="mno">Batal</button><button class="btn pri" data-act="myes">' + esc(label || 'Ya, lanjutkan') + '</button></div></div></div>';
}
function download(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type:mime}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function go(id){ ui.page = id; ui.detail = ''; try{ if (location.hash !== '#' + id) history.replaceState(null,'','#' + id); }catch(e){} render(); try{ window.scrollTo(0,0); }catch(e){} }
function openTrxInUnit(t){
  if (t.kategori === KAT_MATERIAL){ const m = t.material; ui.f.mat = {id:t.id,tanggal:t.tanggal,nama:m ? m.nama : t.ket,qty:m ? String(m.qty).replace('.',',') : '1',satuan:m ? m.satuan : '',harga:String(m ? m.harga : t.jumlah),toko:m ? m.toko : ''}; }
  else if (t.kategori === KAT_PBB || t.kategori === KAT_AGENT){ ui.f.pa = {id:t.id,tanggal:t.tanggal,kategori:t.kategori,ket:t.ket,jumlah:String(t.jumlah)}; }
  else { const w = t.upah; ui.f.upah = {id:t.id,tanggal:t.tanggal,nama:w ? w.nama : '',pekerjaan:w ? w.pekerjaan : t.ket,jumlah:String(t.jumlah)}; }
  go('unit'); ui.detail = t.unitId; render();
  setTimeout(() => { try{ const el = document.getElementById(t.kategori === KAT_MATERIAL ? 'matform' : (t.kategori === KAT_PBB || t.kategori === KAT_AGENT) ? 'paform' : 'upahform'); if (el) el.scrollIntoView(); }catch(e){} }, 0);
}
function setF(path, val){ const [g,k] = path.split('.'); (ui.f[g] || (ui.f[g] = {}))[k] = val; }

    case 'savelain': {
      const f = ui.f.lain, l = {id:f.id || uid(),tanggal:f.tanggal,clusterId:f.clusterId || '',kategori:(f.kategori || '').trim(),ket:(f.ket || '').trim(),jumlah:parseInt(digits(f.jumlah),10) || 0};
      const errs = validateLain(DB, l); if (errs.length){ $('#lainmsg').textContent = errs.join('\n'); break; }
      const i = DB.lain.findIndex(x => x.id === l.id); if (i >= 0) DB.lain[i] = l; else DB.lain.push(l);
      save(); Object.assign(f,{id:null,ket:'',jumlah:''}); render(); toast('Tersimpan'); break; }
    case 'cancellain': Object.assign(ui.f.lain,{id:null,ket:'',jumlah:''}); render(); break;
    case 'editlain': { const l = DB.lain.find(x => x.id === id); if (l){ ui.f.lain = {id:l.id,tanggal:l.tanggal,clusterId:l.clusterId,kategori:l.kategori,ket:l.ket,jumlah:String(l.jumlah)}; render(); try{ window.scrollTo(0,0); }catch(e){} } break; }
    case 'dellain': { const l = DB.lain.find(x => x.id === id); if (!l) break;
      confirmBox('Hapus biaya ' + l.kategori + ' ' + rp(l.jumlah) + ' tanggal ' + tgl(l.tanggal) + '?', () => { DB.lain = DB.lain.filter(x => x.id !== id); save(); render(); toast('Catatan dihapus'); }, 'Hapus'); break; }
    case 'delcluster': DB.clusters = DB.clusters.filter(c => c.id !== id); save(); render(); break;
    case 'csv': { const q = s => '"' + String(s == null ? '' : s).replace(/"/g,'""') + '"';
      const rows = [['Tanggal','Jenis','Cluster','Unit','Kategori','Keterangan','Jumlah']].concat(DB.trx.slice().sort((a,b) => a.tanggal < b.tanggal ? -1 : 1).map(t => [t.tanggal,t.jenis === 'pembelian' ? 'Pembelian' : 'Pendapatan',cname(t.clusterId),uname(t.unitId),t.kategori,t.ket,t.jumlah]).concat(DB.lain.slice().sort((a,b) => a.tanggal < b.tanggal ? -1 : 1).map(l => [l.tanggal,'Biaya Lain',l.clusterId ? cname(l.clusterId) : 'Umum perusahaan','',l.kategori,l.ket,l.jumlah])).concat(DB.modal.slice().sort((a,b) => a.tanggal < b.tanggal ? -1 : 1).map(m => [m.tanggal,'Modal',m.clusterId ? cname(m.clusterId) : 'Umum perusahaan','',m.sumber,m.ket,m.jumlah])).concat(DB.inventaris.slice().sort((a,b) => a.tanggal < b.tanggal ? -1 : 1).map(v => [v.tanggal,'Inventaris',v.clusterId ? cname(v.clusterId) : 'Umum perusahaan','',v.kelompok,v.nama + ' (' + v.qty + ' x ' + v.harga + ', umur ' + v.umur + ' th)',invTotal(v)])));
      download('transaksi-naintiland.csv','﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8'); break; }
    case 'export': download('cadangan-naintiland-' + today() + '.json', JSON.stringify(DB,null,1), 'application/json'); break;
    case 'sample': confirmBox('Muat data contoh? Semua unit dan transaksi saat ini akan diganti.', () => { DB = sampleDb(); ui.f = {}; save(); go('dashboard'); toast('Data contoh dimuat'); }, 'Muat contoh'); break;
    case 'reset': confirmBox('Hapus semua unit dan transaksi? Unduh cadangan dulu bila perlu.', () => { DB.units = []; DB.trx = []; DB.lain = []; DB.modal = []; DB.inventaris = []; DB.rekon = []; ui.rkp = null; ui.rkid = ''; ui.f = {}; save(); go('dashboard'); toast('Data dihapus'); }, 'Hapus semua'); break;
    case 'myes': { const f = yesFn; yesFn = null; $('#overlay').innerHTML = ''; if (f) f(); break; }
    case 'mno': $('#overlay').innerHTML = ''; break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.ff){ setF(t.dataset.ff, t.classList.contains('money') ? digits(t.value) : t.value); if (t.dataset.ff.startsWith('nu.')){ const pv = $('#prev'); if (pv) pv.textContent = prevText(ui.f.nu); }
    if (t.dataset.ff.startsWith('inv.')){ const w = $('#inv_prev'); if (w) w.textContent = invPrev(ui.f.inv); }
    if (t.dataset.ff.startsWith('lain.')){ const w = $('#lainwarn'); if (w) w.textContent = lainWarn(ui.f.lain); }
    if (t.dataset.ff.startsWith('mat.')){ const mt = $('#mat_total'); if (mt) mt.textContent = rp(Math.round(parseQty(ui.f.mat.qty) * (parseInt(digits(ui.f.mat.harga),10) || 0))); }
    return; }
  const f = t.dataset.f; if (!f) return;
  if (f === 'uq' || f === 'tq' || f === 'lq'){ ui[f] = t.value; const pos = t.selectionStart; render(); const n = document.querySelector('[data-f="' + f + '"]'); if (n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
  else if (f === 'cname'){ const c = DB.clusters.find(x => x.id === t.dataset.id); if (c && t.value.trim()){ c.nama = t.value.trim(); save(); } }
  else if (f === 'ttd'){ DB.ttd[t.dataset.k] = t.value; save(); const pp = $('#paper'); if (pp) pp.innerHTML = laporanHtml(ui.lb, ui.lcl); }
  else if (f === 'pname'){ if (t.value.trim()){ DB.perusahaan = t.value.trim(); save(); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.ff){
    setF(t.dataset.ff, t.classList.contains('money') ? digits(t.value) : t.value);
    if (t.dataset.ff === 'inv.kelompok'){ ui.f.inv.umur = String(KEL_INV[t.value] || 4); render(); return; }
    if (t.dataset.ff.endsWith('.clusterId')){ const g = t.dataset.ff.split('.')[0]; if (g !== 'nu' && g !== 'lain' && g !== 'modal' && g !== 'inv') ui.f[g].unitId = ''; }
    if (t.dataset.ff.endsWith('.clusterId') && t.dataset.ff !== 'lain.clusterId' && t.dataset.ff !== 'modal.clusterId' && t.dataset.ff !== 'inv.clusterId') render();
    return;
  }
  const f = t.dataset.f; if (!f) return;
  if (f === 'fc'){ ui.fc = t.value; render(); }
  else if (f === 'uc'){ ui.uc = t.value; render(); }
  else if (f === 'us'){ ui.us = t.value; render(); }
  else if (f === 'tc'){ ui.tc = t.value; render(); }
  else if (f === 'lc'){ ui.lc = t.value; render(); }
  else if (f === 'lb'){ if (/^\d{4}-\d{2}$/.test(t.value)){ ui.lb = t.value; render(); } }
  else if (f === 'lcl'){ ui.lcl = t.value; render(); }
  else if (f === 'rc'){ ui.rc = t.value; ui.ro = ''; render(); }
  else if (f === 'rkfile'){
    const file = t.files[0]; if (!file) return;
    if (/\.pdf$/i.test(file.name)){ readPdf(file, (ui.f.rk || {}).pwd); t.value = ''; return; }
    if (/\.(xlsx|xls)$/i.test(file.name)){
      loadScriptOnce('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js').then(() => { const r = new FileReader(); r.onload = () => { try{ const wb = window.XLSX.read(r.result, {type:'array'}), ws = wb.Sheets[wb.SheetNames[0]]; rkSetParsed(window.XLSX.utils.sheet_to_json(ws, {header:1,raw:false,defval:'',dateNF:'yyyy-mm-dd'}).map(row => row.map(c => String(c).trim())), file.name); }catch(e){ toast('File Excel tidak bisa dibaca. Simpan sebagai CSV lalu unggah lagi.'); } }; r.readAsArrayBuffer(file); })
        .catch(() => toast('Membaca Excel butuh koneksi internet. Simpan sebagai CSV lalu unggah lagi.'));
    } else { const r = new FileReader(); r.onload = () => rkSetParsed(parseTable(String(r.result)), file.name); r.readAsText(file); }
    t.value = '';
  }
  else if (f === 'rkmap'){ if (ui.rkp){ ui.rkp.map[t.dataset.k] = +t.value; render(); } }
  else if (f === 'rkbulan'){ if (ui.rkp) ui.rkp.bulan = t.value; }
  else if (f === 'rkbln'){ const x = DB.rekon.find(y => y.id === ui.rkid); if (x && /^\d{4}-\d{2}$/.test(t.value)){ const mr = monthRange(t.value); x.dari = mr.dari; x.sampai = mr.sampai;
      const S = rekonSummary(x, DB); x.match = autoMatch(x.bank.filter(b => b.tanggal >= x.dari && b.tanggal <= x.sampai), S.book.filter(k => k.tanggal >= x.dari && k.tanggal <= x.sampai), x.tol, S.match); save(); render(); } }
  else if (f === 'rkmatch'){ const x = DB.rekon.find(y => y.id === ui.rkid); if (x && t.value){ x.match[t.dataset.i] = t.value; save(); render(); toast('Dicocokkan'); } }
  else if (f === 'rkcatat'){ const x = DB.rekon.find(y => y.id === ui.rkid), b = x && x.bank[+t.dataset.i], code = t.value; if (!b || !code) return;
    confirmBox('Catat "' + (b.ket || 'mutasi bank').slice(0,60) + '" sebesar ' + rp(b.jumlah) + ' (' + (b.arah === 'masuk' ? 'uang masuk' : 'uang keluar') + ') ke pembukuan?', () => {
      const id2 = uid(), ket = (b.ket || 'Mutasi bank').slice(0,120); let key;
      if (code === 'modal'){ DB.modal.push({id:id2,tanggal:b.tanggal,clusterId:'',sumber:'Setoran bank',ket,jumlah:b.jumlah}); key = 'modal:' + id2; }
      else if (code.startsWith('pend:')){ DB.trx.push({id:id2,jenis:'pendapatan',tanggal:b.tanggal,clusterId:code.slice(5),unitId:'',kategori:PEND_LAIN,ket,jumlah:b.jumlah}); key = 'trx:' + id2; }
      else { DB.lain.push({id:id2,tanggal:b.tanggal,clusterId:code.slice(5),kategori:'Lain-lain',ket,jumlah:b.jumlah}); key = 'lain:' + id2; }
      x.match[b.i] = key; save(); render(); toast('Dicatat dan dicocokkan'); }, 'Catat'); render(); }

  else if (f === 'lk'){ ui.lk = t.value; render(); }
  else if (f === 'uprog'){ const u = DB.units.find(x => x.id === t.dataset.id); if (u){ u.progres = t.value; save(); render(); } }
  else if (f === 'ustatus'){ const u = DB.units.find(x => x.id === t.dataset.id); if (u){ u.status = t.value; save(); render(); } }
  else if (f === 'import'){
    const file = t.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try{
      const o = JSON.parse(r.result); if (!o || !Array.isArray(o.clusters) || !Array.isArray(o.units) || !Array.isArray(o.trx)) throw new Error('format');
      confirmBox('Pulihkan data dari file "' + file.name + '"? Data saat ini akan diganti.', () => { DB = fixDb(o); ui.f = {}; save(); go('dashboard'); toast('Data dipulihkan'); }, 'Pulihkan');
    }catch(e){ toast('File cadangan tidak valid'); } };
    r.readAsText(file); t.value = '';
  }
});
document.addEventListener('focusout', ev => {
  const t = ev.target;
  if (t.classList && t.classList.contains('qty') && t.dataset.ff){ const q = parseQty(t.value); t.value = q ? fmtQty(q) : ''; setF(t.dataset.ff, t.value); const mt = $('#mat_total'); if (mt) mt.textContent = rp(Math.round(parseQty(ui.f.mat.qty) * (parseInt(digits(ui.f.mat.harga),10) || 0))); }
  if (t.classList && t.classList.contains('money') && t.dataset.ff){ const v = digits(t.value); t.value = v ? Number(v).toLocaleString('id-ID') : ''; }
});
window.addEventListener('hashchange', () => { let h = ''; try{ h = location.hash.slice(1); }catch(e){} if (NAV.some(n => n[0] === h) && h !== ui.page){ ui.page = h; ui.detail = ''; render(); } });

load();
try{ const h = location.hash.slice(1); if (NAV.some(n => n[0] === h)) ui.page = h; }catch(e){}
render();
</script>
